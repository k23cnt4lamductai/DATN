<aside class="account-side">
    <div class="account-card">
        <span class="avatar" aria-hidden="true">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
        <div class="account-who">
            <strong>{{ user.first_name|default:user.username }}</strong>
            <span>@{{ user.username }}</span>
        </div>
    </div>
    <nav class="account-nav" aria-label="Tài khoản">
        <a href="{% url 'accounts:profile' %}" class="{% if account_active == 'profile' %}active{% endif %}">👤 Thông tin cá nhân</a>
        <a href="{% url 'accounts:orders' %}" class="{% if account_active == 'orders' %}active{% endif %}">📦 Đơn hàng của tôi</a>
        <a href="{% url 'accounts:password_change' %}" class="{% if account_active == 'password' %}active{% endif %}">🔒 Đổi mật khẩu</a>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">↪ Đăng xuất</button>
        </form>
    </nav>
</aside>
